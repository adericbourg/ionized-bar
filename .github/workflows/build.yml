name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/bundle.sh
      - name: Refuse a build without the hardened runtime, which would open the users' grants to any process
        run: codesign -d --verbose build/IonizedBar.app 2>&1 | grep -q 'flags=.*runtime'
      - run: swift run IonizedBarChecks
