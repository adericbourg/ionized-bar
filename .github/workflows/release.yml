name: Release

on:
  push:
    branches: [main]
    paths: [Support/Info.plist]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Release only a version that has no tag yet
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released, nothing to do"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.tag
        run: swift run IonizedBarChecks
      - if: steps.version.outputs.tag
        run: ./scripts/archive.sh
      - if: steps.version.outputs.tag
        run: gh release create "${{ steps.version.outputs.tag }}" build/IonizedBar-*.zip --target "$GITHUB_SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes

  cask:
    needs: release
    if: needs.release.outputs.tag
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: adericbourg/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Point the cask at the release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'IonizedBar-*.zip' --dir "$RUNNER_TEMP"
          sha=$(sha256sum "$RUNNER_TEMP"/IonizedBar-*.zip | cut -d' ' -f1)
          sed -i -E "s/^  version \".*\"/  version \"${TAG#v}\"/; s/^  sha256 \"[^\"]*\"/  sha256 \"$sha\"/" Casks/ionized-bar.rb
          # Fails when the cask already holds this version and checksum
          ! git diff --quiet Casks/ionized-bar.rb
      - name: Push to the tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Brew cask update for ionized-bar version $TAG"
          git push
