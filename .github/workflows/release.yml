name: Release

on:
  push:
    branches: [main]
    paths: [Support/Info.plist]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # A manual run from another branch would release unmerged code
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Release only a version that has no tag yet
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Unexpected version '$version' in Info.plist" >&2
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released, nothing to do"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.tag
        run: swift run IonizedBarChecks
      - name: Import the signing certificate
        if: steps.version.outputs.tag
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          # Lets codesign use the key without a UI prompt
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - if: steps.version.outputs.tag
        run: ./scripts/archive.sh
      - name: Refuse an ad-hoc build, which would lose the users' grants
        if: steps.version.outputs.tag
        run: codesign -dr - build/IonizedBar.app 2>&1 | grep -q 'certificate leaf'
      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - if: steps.version.outputs.tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" build/IonizedBar-*.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  cask:
    needs: release
    if: needs.release.outputs.tag
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: adericbourg/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Point the cask at the release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'IonizedBar-*.zip' --dir "$RUNNER_TEMP"
          sha=$(sha256sum "$RUNNER_TEMP"/IonizedBar-*.zip | cut -d' ' -f1)
          sed -i -E "s/^  version \".*\"/  version \"${TAG#v}\"/; s/^  sha256 \"[^\"]*\"/  sha256 \"$sha\"/" Casks/ionized-bar.rb
          # Fails when the cask already holds this version and checksum
          ! git diff --quiet Casks/ionized-bar.rb
      - name: Push to the tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Brew cask update for ionized-bar version $TAG"
          git push
